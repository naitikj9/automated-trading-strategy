symbol: "BSE.NS"
interval: "1d"
start: "2022-01-01"
end: null

# Stocks the scanner checks every day
watchlist:
  - BSE.NS
  - PASHUPATI.NS
  - LAURUSLABS.NS
  - MANKIND.NS
  - LUPIN.NS
  - DIXON.NS

strategy:
  name: "dmi_macd"
  params:
    di_length: 14
    adx_smoothing: 14
    adx_min: 0
    adx_rising_bars: 1
    macd_lookback: 5
    zero_band_pct: 0.005
    min_strength: 1        # 1 = normal+, 2 = strong+, 3 = super strong only
    require_ema_trend: true
    exit_ema: 50           # tuned on 2018-2023; beat EMA 20 on unseen 2024-2026 in all three indices
    allow_short: false

backtest:
  initial_capital: 100000
  commission_pct: 0.0003
  slippage_pct: 0.0005

risk:
  max_position_pct: 1.0
  stop_loss_pct: 0.02
