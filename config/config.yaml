symbol: "BSE.NS"
interval: "1d"
start: "2022-01-01"
end: null

# Stocks the scanner checks every day
watchlist:
  - ^CNXPHARMA
  - BSE.NS
  - PASHUPATI.NS
  - LAURUSLABS.NS
  - MANKIND.NS
  - LUPIN.NS
  - DIXON.NS

strategy:
  name: "dmi_macd"
  params:
    di_length: 14
    adx_smoothing: 14
    adx_min: 15            # ADX must be rising and at least 15
    adx_rising_bars: 1
    macd_lookback: null    # null = MACD just has to be on the right side of its signal
    zero_band_pct: 0.005
    min_strength: 1        # 1 = normal+, 2 = strong+, 3 = super strong only
    require_pattern: true  # only trade the main entry after a MACD double dip / divergence
    require_ema_trend: true
    di_cross_reentry: true # in an EMA uptrend, buy when +DI crosses back above -DI
    ema_reclaim_reentry: true # buy a close back above EMA 20 after a pullback that held EMA 50
    ema_pullback_entry: true  # enter when a pullback to within 2% of EMA 20 is rejected
    short_reentry_needs_adx: true # every sell entry needs ADX rising and >= adx_min
    reentry_needs_di: true    # EMA 20 reclaim/bounce re-entries also need +DI > -DI (audit fix A)
    entry_ema_buffer: 0.02    # every entry needs the close 2% above EMA 50, cuts 1-day whipsaws (audit fix B)
    poc_filter: false      # longs only above the volume-profile POC, shorts only below
    poc_retest_entry: false # after a value-area breakout, buy a bounce off POC
    exit_on_di_cross: false  # exit only when the close breaks EMA 50
    base_max_range: 0.25   # accumulation = 60 bars inside a range no wider than 25%
    accumulation_breakout: false # buy a high-volume close above an accumulation range
    skip_inside_base: false      # ignore re-entries while still inside the range
    exit_ema: 50           # tuned on 2018-2023; beat EMA 20 on unseen 2024-2026 in all three indices
    allow_short: false

backtest:
  initial_capital: 100000
  commission_pct: 0.0003
  slippage_pct: 0.0005

risk:
  max_position_pct: 1.0
  stop_loss_pct: 0.02

# Daily chart decides the trend; the 1-hour chart times re-entries while flat (see strategies/mtf.py)
hourly:
  enabled: true
  triggers: [ema_cross]   # ema_cross = 1h EMA 20 crosses above EMA 50; di_cross = 1h +DI crosses above -DI

# Paper trading (paper_trade.py). The book is saved in `folder`.
paper:
  universe: smallcap100   # watchlist, or an NSE index: nifty50, midcap100, smallcap100
  capital: 1000000
  max_positions: null     # null = capital split equally across every stock, as in the backtests
  folder: paper
